<article
  class="flex h-full w-full max-w-sm flex-col rounded-3xl border border-slate-200 bg-white p-5 shadow-sm shadow-slate-900/5 transition-transform duration-200 hover:-translate-y-1 hover:shadow-md"
>
  <div class="mb-4 flex items-start justify-between gap-4">
    <div>
      <p class="text-xs font-medium uppercase tracking-[0.18em] text-slate-500">
        {{ coin.country | countryFlag }}
      </p>
      <h3 class="mt-2 text-xl font-semibold tracking-tight text-slate-900">
        {{ coin.name }}
      </h3>
    </div>

    <span class="rounded-full bg-slate-100 px-3 py-1 text-sm font-semibold text-slate-700">
      {{ coin.year }}
    </span>
  </div>

  <p class="flex-1 text-sm leading-6 text-slate-600">
    {{ coin.description }}
  </p>

  <div class="mt-5 grid gap-3 sm:grid-cols-2">
    <div class="rounded-2xl bg-slate-50 px-4 py-3">
      <p class="text-[11px] font-medium uppercase tracking-[0.16em] text-slate-500">
        Currency value
      </p>
      <p class="mt-1 text-lg font-bold text-slate-900">
        {{ coin.currencyValue | currency: 'EUR' }}
      </p>
    </div>

    <div class="rounded-2xl bg-slate-50 px-4 py-3">
      <p class="text-[11px] font-medium uppercase tracking-[0.16em] text-slate-500">
        Estimated value
      </p>
      <p class="mt-1 text-lg font-bold text-slate-900">
        {{ coin.estimatedValue | currency: 'EUR' }}
      </p>
    </div>
  </div>

  <button
    mat-flat-button
    type="button"
    class="!mt-5 !h-11 !w-full !rounded-full !text-sm !font-semibold !tracking-[0.08em]"
    (click)="sell()"
    [attr.aria-label]="'Sell ' + coin.name"
  >
    Sell {{ coin.name }}
  </button>
</article>
