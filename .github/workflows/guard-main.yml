name: Guard main (no direct push)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    name: Block direct push to main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify push is a PR merge
        run: |
          # A merge commit has 2+ parents. Direct pushes are single-parent commits.
          PARENTS=$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')
          echo "Parent count for HEAD: ${PARENTS}"
          if [ "${PARENTS}" -lt 2 ]; then
            echo "::error::Direct push to 'main' is not allowed. Open a Pull Request and merge it instead."
            exit 1
          fi
          echo "OK: push to main is a merge commit (PR merge)."
