@if (coinsCollection$ | async; as coinsCollection) {
  @let coinInfo = getCoinInfo(coinsCollection);
  <div class="grid gap-3 sm:grid-cols-[minmax(0,1.65fr)_minmax(140px,0.75fr)]">
    <div class="rounded-2xl bg-slate-50 px-5 py-5">
      <p class="text-xs font-medium uppercase tracking-[0.18em] text-slate-500">Total value</p>
      <p class="mt-3 text-3xl font-bold tracking-tight text-slate-900 lg:text-4xl">
        {{ coinInfo.collectionValue | currency: 'EUR' }}
      </p>
    </div>

    <div class="rounded-2xl bg-slate-50 px-4 py-4 sm:self-stretch">
      <p class="text-xs font-medium uppercase tracking-[0.18em] text-slate-500">Coins</p>
      <p class="mt-2 text-2xl font-bold text-slate-900">{{ coinInfo.numCoins }}</p>
    </div>
  </div>
}
